name: gorouter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  firebase_core: ^3.12.1
  fluttertoast: ^8.2.2
  firebase_auth: ^5.5.1
  get_it: ^8.0.3
  dio: ^5.8.0+1
  lottie: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
      - assets/images/imgStart.jpg
      - assets/animations/rain.json
      - assets/animations/cloudy.json
      - assets/animations/loading.json
      - assets/animations/snow.json
      - assets/animations/sunny.json
      - assets/animations/thunder.json
      - assets/animations/world-location.json
